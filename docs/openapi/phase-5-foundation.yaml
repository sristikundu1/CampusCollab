openapi: 3.1.0
info:
  title: CampusCollab API
  version: 0.4.0
  description: Implemented CampusCollab foundation, authentication, profiles, Gigs Marketplace, and Proposal workflow contract.
servers:
  - url: http://localhost:5000
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Required dependency readiness
      responses:
        '200': { description: Ready }
        '503': { description: MongoDB is unavailable }
  /health/live:
    get:
      summary: Canonical Phase 4 liveness alias
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      summary: Canonical Phase 4 readiness alias
      responses:
        '200': { description: Ready }
        '503': { description: MongoDB is unavailable }
  /api/v1/gigs:
    get:
      summary: Discover published visible gigs
      parameters:
        - { in: query, name: q, schema: { type: string, minLength: 1, maxLength: 80 } }
        - { in: query, name: skillId, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
        - { in: query, name: category, schema: { type: string, maxLength: 80 } }
        - { in: query, name: workMode, schema: { type: string, enum: [REMOTE, HYBRID, ONSITE] } }
        - { in: query, name: sort, schema: { type: string, enum: [NEWEST, DEADLINE], default: NEWEST } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200': { description: Cursor-paginated public gig cards }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Create an owned gig draft
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GigWrite' } } }
      responses:
        '201': { description: Draft created }
        '401': { description: Authentication required }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/gigs/mine:
    get:
      summary: List gigs owned by the authenticated user
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/GigStatus' } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200': { description: Cursor-paginated owned gigs }
  /api/v1/gigs/{gigId}:
    parameters: [{ $ref: '#/components/parameters/GigId' }]
    get:
      summary: Read a visible gig or an owned private-state gig as an authenticated user
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Visibility-safe gig detail }
        '401': { description: Authentication required }
        '404': { description: Missing or concealed gig }
    patch:
      summary: Edit an owned draft or published gig
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GigWritePartial' } } }
      responses:
        '200': { description: Updated owned gig }
        '404': { description: Missing or non-owned gig }
        '409': { description: Invalid lifecycle state or capacity conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Permanently delete an owned draft or archived gig with no collaboration history
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '204': { description: Gig and related bookmarks permanently deleted }
        '404': { description: Missing or non-owned gig }
        '409': { description: Invalid lifecycle state, collaboration history, or concurrent modification }
  /api/v1/gigs/{gigId}:publish:
    post: { summary: Publish an owned draft, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Published }, '409': { description: Invalid state or incomplete gig } } }
  /api/v1/gigs/{gigId}:close:
    post: { summary: Close an owned published gig, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Closed }, '409': { description: Invalid state } } }
  /api/v1/gigs/{gigId}:cancel:
    post: { summary: Cancel an eligible owned gig with a reason, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Cancelled }, '409': { description: Invalid state }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/gigs/{gigId}:archive:
    post: { summary: Archive an eligible owned gig, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Archived }, '409': { description: Invalid state } } }
  /api/v1/gigs/{gigId}:start:
    post: { summary: Start an assigned owned gig, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Active }, '409': { description: Invalid state } } }
  /api/v1/gigs/{gigId}:restore:
    post: { summary: Restore an owned archived gig, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Restored as a published gig or draft }, '409': { description: Invalid state } } }
  /api/v1/gigs/{gigId}/bookmark:
    parameters: [{ $ref: '#/components/parameters/GigId' }]
    post: { summary: Bookmark a visible gig idempotently, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '200': { description: Existing bookmark }, '201': { description: Bookmark created }, '404': { description: Gig not visible } } }
    delete: { summary: Remove the authenticated user's bookmark idempotently, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '204': { description: Bookmark absent } } }
  /api/v1/users/me/bookmarked-gigs:
    get:
      summary: List the authenticated user's visible bookmarked gigs
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { '200': { description: Cursor-paginated bookmarked gigs } }
  /api/v1/gigs/{gigId}/proposals:
    parameters: [{ $ref: '#/components/parameters/GigId' }]
    post:
      summary: Submit one active proposal as the authenticated eligible student
      security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalRevisionWrite' } } } }
      responses: { '201': { description: Proposal submitted }, '404': { description: Gig unavailable or concealed }, '409': { description: Duplicate, incomplete profile, invalid gig state, deadline, or capacity conflict }, '422': { $ref: '#/components/responses/ValidationError' } }
    get:
      summary: List proposals for an owned gig
      security: [{ sessionCookie: [] }]
      parameters: [{ in: query, name: status, schema: { $ref: '#/components/schemas/ProposalStatus' } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Visibility-safe owner proposal review list }, '404': { description: Missing or non-owned gig } }
  /api/v1/proposals/mine:
    get:
      summary: List proposals submitted by the authenticated student
      security: [{ sessionCookie: [] }]
      parameters: [{ in: query, name: status, schema: { $ref: '#/components/schemas/ProposalStatus' } }, { in: query, name: gigId, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Cursor-paginated own proposals } }
  /api/v1/proposals/{proposalId}:
    parameters: [{ $ref: '#/components/parameters/ProposalId' }]
    get: { summary: Get an own or owned-gig proposal, security: [{ sessionCookie: [] }], responses: { '200': { description: Role-safe proposal detail with revisions }, '404': { description: Missing or concealed proposal } } }
    patch:
      summary: Append a revision to an active own proposal
      security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalRevisionWrite' } } } }
      responses: { '200': { description: Revision appended }, '404': { description: Missing or non-owned proposal }, '409': { description: Invalid state, revision limit, or concurrent modification } }
  /api/v1/proposals/{proposalId}:withdraw:
    post: { summary: Withdraw an active own proposal, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProposalId' }], responses: { '200': { description: Withdrawn idempotently }, '404': { description: Missing or non-owned proposal }, '409': { description: Invalid state } } }
  /api/v1/proposals/{proposalId}:shortlist:
    post: { summary: Shortlist a submitted proposal as gig owner, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProposalId' }], responses: { '200': { description: Shortlisted }, '404': { description: Missing or non-owned gig proposal }, '409': { description: Invalid state or concurrent modification } } }
  /api/v1/proposals/{proposalId}:accept:
    post: { summary: Atomically accept a proposal within gig capacity, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProposalId' }], responses: { '200': { description: Accepted and gig capacity updated }, '404': { description: Missing or non-owned gig proposal }, '409': { description: Invalid state, eligibility, capacity, or concurrent modification } } }
  /api/v1/proposals/{proposalId}:reject:
    post: { summary: Reject an active proposal as gig owner, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProposalId' }], responses: { '200': { description: Rejected }, '404': { description: Missing or non-owned gig proposal }, '409': { description: Invalid state or concurrent modification } } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: campuscollab_session }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
    idempotencyKey: { type: apiKey, in: header, name: Idempotency-Key }
  parameters:
    GigId: { in: path, name: gigId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
    ProposalId: { in: path, name: proposalId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
    Cursor: { in: query, name: cursor, schema: { type: string, maxLength: 1024 } }
    Limit: { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
  responses:
    ValidationError: { description: Strict request validation failed }
  schemas:
    GigStatus: { type: string, enum: [DRAFT, PUBLISHED, ASSIGNED, ACTIVE, COMPLETION_PENDING, COMPLETED, CLOSED, CANCELLED, ARCHIVED] }
    ProposalStatus: { type: string, enum: [SUBMITTED, SHORTLISTED, ACCEPTED, REJECTED, WITHDRAWN, CLOSED] }
    ProposalRevisionWrite:
      type: object
      additionalProperties: false
      required: [coverMessage]
      properties:
        coverMessage: { type: string, minLength: 20, maxLength: 5000 }
        proposedBudget: { type: object, additionalProperties: false, required: [type], properties: { type: { type: string, enum: [FIXED, RANGE, UNPAID] }, minMinor: { type: integer, minimum: 0 }, maxMinor: { type: integer, minimum: 0 }, currency: { type: string, minLength: 3, maxLength: 3 } } }
        proposedDuration: { type: string, maxLength: 120 }
        availability: { type: string, maxLength: 300 }
    SkillRequirement:
      type: object
      additionalProperties: false
      required: [skillId, level]
      properties:
        skillId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        level: { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
        required: { type: boolean, default: true }
    GigWriteFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 180 }
        description: { type: string, minLength: 20, maxLength: 10000 }
        category: { type: string, minLength: 2, maxLength: 80 }
        skillRequirements: { type: array, maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/SkillRequirement' } }
        workMode: { type: string, enum: [REMOTE, HYBRID, ONSITE], default: REMOTE }
        locationText: { type: string, maxLength: 160 }
        visibility: { type: string, enum: [PLATFORM, UNIVERSITY], default: PLATFORM }
        budget: { type: object, additionalProperties: false, properties: { type: { type: string, enum: [FIXED, RANGE, UNPAID] }, minMinor: { type: integer, minimum: 0 }, maxMinor: { type: integer, minimum: 0 }, currency: { type: string, minLength: 3, maxLength: 3 } } }
        deadlineAt: { type: [string, 'null'], format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100, default: 1 }
    GigWrite:
      allOf: [{ $ref: '#/components/schemas/GigWriteFields' }]
      required: [title, description, category]
    GigWritePartial:
      allOf: [{ $ref: '#/components/schemas/GigWriteFields' }]
      minProperties: 1
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, const: alive }
        meta:
          type: object
          required: [requestId]
          properties:
            requestId: { type: string }
