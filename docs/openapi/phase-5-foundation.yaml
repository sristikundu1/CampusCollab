openapi: 3.1.0
info:
  title: CampusCollab API
  version: 0.5.0
  description: Implemented CampusCollab foundation, authentication, profiles, Gigs, Proposals, Projects, and Collaboration workflow contract.
servers:
  - url: http://localhost:5000
paths:
  /health:
    get:
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      summary: Required dependency readiness
      responses:
        '200': { description: Ready }
        '503': { description: MongoDB is unavailable }
  /health/live:
    get:
      summary: Canonical Phase 4 liveness alias
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      summary: Canonical Phase 4 readiness alias
      responses:
        '200': { description: Ready }
        '503': { description: MongoDB is unavailable }
  /api/v1/auth/register:
    post: { summary: Register with an approved university-domain address, responses: { '201': { description: Account created }, '409': { description: Address already registered }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/auth/login:
    post: { summary: Start an opaque server-side session, responses: { '200': { description: Session created }, '401': { description: Invalid credentials } } }
  /api/v1/auth/logout:
    post: { summary: Revoke the current session, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '204': { description: Session revoked } } }
  /api/v1/auth/me:
    get: { summary: Read the authenticated user and CSRF token, security: [{ sessionCookie: [] }], responses: { '200': { description: Current session }, '401': { description: Authentication required } } }
  /api/v1/auth/verify-email:
    post: { summary: Verify an email token when verification is enabled, responses: { '200': { description: Address verified }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/auth/verification/resend:
    post: { summary: Request another verification message when email delivery is enabled, responses: { '202': { description: Request accepted } } }
  /api/v1/auth/password/forgot:
    post: { summary: Request password recovery when email delivery is enabled, responses: { '202': { description: Request accepted } } }
  /api/v1/auth/password/reset:
    post: { summary: Reset a password with a valid recovery token, responses: { '200': { description: Password reset }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/profiles/me:
    get: { summary: Read the authenticated profile, security: [{ sessionCookie: [] }], responses: { '200': { description: Own profile } } }
    post: { summary: Create a missing authenticated profile, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '201': { description: Profile created }, '409': { description: Profile already exists } } }
    patch: { summary: Update allowlisted own-profile fields, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '200': { description: Profile updated }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/profiles/me/skills:
    put: { summary: Replace own profile skills, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '200': { description: Skills updated } } }
  /api/v1/profiles/me/availability:
    patch: { summary: Update consistent availability fields, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '200': { description: Availability updated }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/profiles/me/portfolio-items:
    get: { summary: List own portfolio items, security: [{ sessionCookie: [] }], responses: { '200': { description: Portfolio items } } }
    post: { summary: Create an own portfolio item, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '201': { description: Portfolio item created } } }
  /api/v1/profiles/{userId}:
    get: { summary: Read a visibility-safe public profile, responses: { '200': { description: Public profile }, '404': { description: Missing or concealed profile } } }
  /api/v1/profiles/{userId}/portfolio-items:
    get: { summary: List visibility-safe published portfolio items, responses: { '200': { description: Published portfolio items } } }
  /api/v1/portfolio-items/{itemId}:
    get: { summary: Read an owned or published portfolio item, responses: { '200': { description: Portfolio item }, '404': { description: Missing or concealed item } } }
    patch: { summary: Update an own portfolio item, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '200': { description: Portfolio item updated } } }
    delete: { summary: Archive an own portfolio item, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '204': { description: Portfolio item archived } } }
  /api/v1/skills:
    get: { summary: List active canonical and custom skills, responses: { '200': { description: Skill catalogue } } }
    post: { summary: Create a normalized custom skill, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '201': { description: Skill created } } }
  /api/v1/gigs:
    get:
      summary: Discover published visible gigs
      parameters:
        - { in: query, name: q, schema: { type: string, minLength: 1, maxLength: 80 } }
        - { in: query, name: skillId, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
        - { in: query, name: category, schema: { type: string, maxLength: 80 } }
        - { in: query, name: workMode, schema: { type: string, enum: [REMOTE, HYBRID, ONSITE] } }
        - { in: query, name: sort, schema: { type: string, enum: [NEWEST, DEADLINE], default: NEWEST } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200': { description: Cursor-paginated public gig cards }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Create an owned gig draft
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GigWrite' } } }
      responses:
        '201': { description: Draft created }
        '401': { description: Authentication required }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/gigs/mine:
    get:
      summary: List gigs owned by the authenticated user
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/GigStatus' } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200': { description: Cursor-paginated owned gigs }
  /api/v1/gigs/{gigId}:
    parameters: [{ $ref: '#/components/parameters/GigId' }]
    get:
      summary: Read a visible gig or an owned private-state gig as an authenticated user
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Visibility-safe gig detail }
        '401': { description: Authentication required }
        '404': { description: Missing or concealed gig }
    patch:
      summary: Edit an owned draft or published gig
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GigWritePartial' } } }
      responses:
        '200': { description: Updated owned gig }
        '404': { description: Missing or non-owned gig }
        '409': { description: Invalid lifecycle state or capacity conflict }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Permanently delete an owned draft or archived gig with no collaboration history
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '204': { description: Gig and related bookmarks permanently deleted }
        '404': { description: Missing or non-owned gig }
        '409': { description: 'Invalid lifecycle state, collaboration history, or concurrent modification' }
  /api/v1/gigs/{gigId}:publish:
    post: { summary: Publish an owned draft, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Published }, '409': { description: Invalid state or incomplete gig } } }
  /api/v1/gigs/{gigId}:close:
    post: { summary: Close an owned published gig, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Closed }, '409': { description: Invalid state } } }
  /api/v1/gigs/{gigId}:cancel:
    post: { summary: Cancel an eligible owned gig with a reason, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Cancelled }, '409': { description: Invalid state }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/gigs/{gigId}:archive:
    post: { summary: Archive an eligible owned gig, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Archived }, '409': { description: Invalid state } } }
  /api/v1/gigs/{gigId}:start:
    post: { summary: Start an assigned owned gig, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Active }, '409': { description: Invalid state } } }
  /api/v1/gigs/{gigId}:restore:
    post: { summary: Restore an owned archived gig, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/GigId' }], responses: { '200': { description: Restored as a published gig or draft }, '409': { description: Invalid state } } }
  /api/v1/gigs/{gigId}/bookmark:
    parameters: [{ $ref: '#/components/parameters/GigId' }]
    post: { summary: Bookmark a visible gig idempotently, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '200': { description: Existing bookmark }, '201': { description: Bookmark created }, '404': { description: Gig not visible } } }
    delete: { summary: Remove the authenticated user's bookmark idempotently, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '204': { description: Bookmark absent } } }
  /api/v1/users/me/bookmarked-gigs:
    get:
      summary: List the authenticated user's visible bookmarked gigs
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { '200': { description: Cursor-paginated bookmarked gigs } }
  /api/v1/gigs/{gigId}/proposals:
    parameters: [{ $ref: '#/components/parameters/GigId' }]
    post:
      summary: Submit one active proposal as the authenticated eligible student
      security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalRevisionWrite' } } } }
      responses: { '201': { description: Proposal submitted }, '404': { description: Gig unavailable or concealed }, '409': { description: 'Duplicate, incomplete profile, invalid gig state, deadline, or capacity conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
    get:
      summary: List proposals for an owned gig
      security: [{ sessionCookie: [] }]
      parameters: [{ in: query, name: status, schema: { $ref: '#/components/schemas/ProposalStatus' } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Visibility-safe owner proposal review list }, '404': { description: Missing or non-owned gig } }
  /api/v1/proposals/mine:
    get:
      summary: List proposals submitted by the authenticated student
      security: [{ sessionCookie: [] }]
      parameters: [{ in: query, name: status, schema: { $ref: '#/components/schemas/ProposalStatus' } }, { in: query, name: gigId, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Cursor-paginated own proposals } }
  /api/v1/proposals/{proposalId}:
    parameters: [{ $ref: '#/components/parameters/ProposalId' }]
    get: { summary: Get an own or owned-gig proposal, security: [{ sessionCookie: [] }], responses: { '200': { description: Role-safe proposal detail with revisions }, '404': { description: Missing or concealed proposal } } }
    patch:
      summary: Append a revision to an active own proposal
      security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalRevisionWrite' } } } }
      responses: { '200': { description: Revision appended }, '404': { description: Missing or non-owned proposal }, '409': { description: 'Invalid state, revision limit, or concurrent modification' } }
  /api/v1/proposals/{proposalId}:withdraw:
    post: { summary: Withdraw an active own proposal, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProposalId' }], responses: { '200': { description: Withdrawn idempotently }, '404': { description: Missing or non-owned proposal }, '409': { description: Invalid state } } }
  /api/v1/proposals/{proposalId}:shortlist:
    post: { summary: Shortlist a submitted proposal as gig owner, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProposalId' }], responses: { '200': { description: Shortlisted }, '404': { description: Missing or non-owned gig proposal }, '409': { description: Invalid state or concurrent modification } } }
  /api/v1/proposals/{proposalId}:accept:
    post: { summary: Atomically accept a proposal within gig capacity, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProposalId' }], responses: { '200': { description: Accepted and gig capacity updated }, '404': { description: Missing or non-owned gig proposal }, '409': { description: 'Invalid state, eligibility, capacity, or concurrent modification' } } }
  /api/v1/proposals/{proposalId}:reject:
    post: { summary: Reject an active proposal as gig owner, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProposalId' }], responses: { '200': { description: Rejected }, '404': { description: Missing or non-owned gig proposal }, '409': { description: Invalid state or concurrent modification } } }
  /api/v1/projects:
    get: { summary: Discover visible recruiting or active projects, responses: { '200': { description: Cursor-paginated project cards } } }
    post: { summary: Create an owned project draft with embedded openings, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '201': { description: Project draft created }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/projects/mine:
    get: { summary: List projects owned by or joined by the authenticated student, security: [{ sessionCookie: [] }], responses: { '200': { description: Cursor-paginated project cards } } }
  /api/v1/projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get: { summary: Read a visibility-safe project, responses: { '200': { description: Project detail }, '404': { description: Missing or concealed project } } }
    patch: { summary: Edit an owned draft or recruiting project, security: [{ sessionCookie: [], csrfToken: [] }], responses: { '200': { description: Project updated }, '404': { description: Missing or non-owned project }, '409': { description: Invalid lifecycle or terms state } } }
  /api/v1/projects/{projectId}:publish:
    post: { summary: Publish a complete owned draft, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProjectId' }], responses: { '200': { description: Recruiting project }, '409': { description: Incomplete or invalid state } } }
  /api/v1/projects/{projectId}:transition:
    post: { summary: 'Start, cancel, or archive an owned project through its state machine', security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProjectId' }], responses: { '200': { description: Transition completed }, '409': { description: Invalid state or start precondition } } }
  /api/v1/projects/{projectId}/recruitment:
    patch: { summary: Toggle recruitment independently for recruiting or active projects, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProjectId' }], responses: { '200': { description: Recruitment state updated } } }
  /api/v1/projects/{projectId}/openings:
    post: { summary: Add an embedded project opening as owner, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/ProjectId' }], responses: { '201': { description: Opening created } } }
  /api/v1/projects/{projectId}/openings/{openingId}:
    patch: { summary: Edit an opening without invalidating commitments, security: [{ sessionCookie: [], csrfToken: [] }], parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/OpeningId' }], responses: { '200': { description: Opening updated }, '409': { description: Capacity or terms conflict } } }
  /api/v1/projects/{projectId}/openings/{openingId}:close:
    post: { summary: Close intake and expire pending participation items, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/OpeningId' }], responses: { '200': { description: Opening closed } } }
  /api/v1/projects/{projectId}/openings/{openingId}:reopen:
    post: { summary: Reopen an eligible opening with remaining capacity, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/OpeningId' }], responses: { '200': { description: Opening reopened } } }
  /api/v1/projects/{projectId}/openings/{openingId}/join-requests:
    post: { summary: Submit one idempotent authenticated-student join request, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '201': { description: Join request submitted }, '409': { description: 'Duplicate, membership, lifecycle, or capacity conflict' } } }
  /api/v1/join-requests/mine:
    get: { summary: List authenticated applicant join requests, security: [{ sessionCookie: [] }], responses: { '200': { description: Private join-request list } } }
  /api/v1/projects/{projectId}/join-requests:
    get: { summary: List requests for an owned project, security: [{ sessionCookie: [] }], responses: { '200': { description: Owner review list }, '404': { description: Missing or non-owned project } } }
  /api/v1/join-requests/{requestId}:
    get: { summary: Read a request as its applicant or project owner, security: [{ sessionCookie: [] }], responses: { '200': { description: Join request }, '404': { description: Missing or concealed request } } }
  /api/v1/join-requests/{requestId}:accept:
    post: { summary: 'Atomically accept as owner, increment opening capacity, and create membership', security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '200': { description: Membership created }, '409': { description: 'Capacity, eligibility, duplicate, or concurrent conflict' } } }
  /api/v1/join-requests/{requestId}:reject:
    post: { summary: Reject a pending request as project owner, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '200': { description: Request rejected } } }
  /api/v1/join-requests/{requestId}:withdraw:
    post: { summary: Withdraw an own pending request, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '200': { description: Request withdrawn } } }
  /api/v1/projects/{projectId}/openings/{openingId}/invitations:
    post: { summary: Invite a server-validated eligible student as project owner, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '201': { description: Invitation sent }, '409': { description: 'Duplicate, eligibility, lifecycle, or capacity conflict' } } }
  /api/v1/invitations/mine:
    get: { summary: List invitations for the authenticated invitee, security: [{ sessionCookie: [] }], responses: { '200': { description: Private invitation list } } }
  /api/v1/projects/{projectId}/invitations:
    get: { summary: List invitations for an owned project, security: [{ sessionCookie: [] }], responses: { '200': { description: Owner invitation list }, '404': { description: Missing or non-owned project } } }
  /api/v1/invitations/{invitationId}:
    get: { summary: Read an invitation as its invitee or project owner, security: [{ sessionCookie: [] }], responses: { '200': { description: Invitation }, '404': { description: Missing or concealed invitation } } }
  /api/v1/invitations/{invitationId}:accept:
    post: { summary: Atomically accept an own pending invitation and create membership, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '200': { description: Membership created }, '409': { description: 'Expired, capacity, eligibility, duplicate, or concurrent conflict' } } }
  /api/v1/invitations/{invitationId}:reject:
    post: { summary: Reject an own pending invitation, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '200': { description: Invitation rejected } } }
  /api/v1/invitations/{invitationId}:revoke:
    post: { summary: Revoke an owned-project pending invitation, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '200': { description: Invitation revoked } } }
  /api/v1/projects/{projectId}/members:
    get: { summary: List owner and membership history for an authorized project participant, security: [{ sessionCookie: [] }], responses: { '200': { description: Project member list } } }
  /api/v1/projects/{projectId}/members/{membershipId}:leave:
    post: { summary: Leave own active membership and release opening capacity transactionally, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '200': { description: Membership left } } }
  /api/v1/projects/{projectId}/members/{membershipId}:remove:
    post: { summary: Remove an active member as owner and release capacity transactionally, security: [{ sessionCookie: [], csrfToken: [], idempotencyKey: [] }], responses: { '200': { description: Membership removed } } }
  /api/v1/projects/{projectId}/invite-candidates:
    get: { summary: Search eligible non-member invite candidates as project owner, security: [{ sessionCookie: [] }], responses: { '200': { description: Eligible candidates }, '404': { description: Missing or non-owned project } } }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: campuscollab_session }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
    idempotencyKey: { type: apiKey, in: header, name: Idempotency-Key }
  parameters:
    GigId: { in: path, name: gigId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
    ProposalId: { in: path, name: proposalId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
    ProjectId: { in: path, name: projectId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
    OpeningId: { in: path, name: openingId, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
    Cursor: { in: query, name: cursor, schema: { type: string, maxLength: 1024 } }
    Limit: { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
  responses:
    ValidationError: { description: Strict request validation failed }
  schemas:
    GigStatus: { type: string, enum: [DRAFT, PUBLISHED, ASSIGNED, ACTIVE, COMPLETION_PENDING, COMPLETED, CLOSED, CANCELLED, ARCHIVED] }
    ProposalStatus: { type: string, enum: [SUBMITTED, SHORTLISTED, ACCEPTED, REJECTED, WITHDRAWN, CLOSED] }
    ProposalRevisionWrite:
      type: object
      additionalProperties: false
      required: [coverMessage]
      properties:
        coverMessage: { type: string, minLength: 20, maxLength: 5000 }
        proposedBudget: { type: object, additionalProperties: false, required: [type], properties: { type: { type: string, enum: [FIXED, RANGE, UNPAID] }, minMinor: { type: integer, minimum: 0 }, maxMinor: { type: integer, minimum: 0 }, currency: { type: string, minLength: 3, maxLength: 3 } } }
        proposedDuration: { type: string, maxLength: 120 }
        availability: { type: string, maxLength: 300 }
    SkillRequirement:
      type: object
      additionalProperties: false
      required: [skillId, level]
      properties:
        skillId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        level: { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
        required: { type: boolean, default: true }
    GigWriteFields:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 5, maxLength: 180 }
        description: { type: string, minLength: 20, maxLength: 10000 }
        category: { type: string, minLength: 2, maxLength: 80 }
        skillRequirements: { type: array, maxItems: 20, uniqueItems: true, items: { $ref: '#/components/schemas/SkillRequirement' } }
        workMode: { type: string, enum: [REMOTE, HYBRID, ONSITE], default: REMOTE }
        locationText: { type: string, maxLength: 160 }
        visibility: { type: string, enum: [PLATFORM, UNIVERSITY], default: PLATFORM }
        budget: { type: object, additionalProperties: false, properties: { type: { type: string, enum: [FIXED, RANGE, UNPAID] }, minMinor: { type: integer, minimum: 0 }, maxMinor: { type: integer, minimum: 0 }, currency: { type: string, minLength: 3, maxLength: 3 } } }
        deadlineAt: { type: [string, 'null'], format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100, default: 1 }
    GigWrite:
      allOf: [{ $ref: '#/components/schemas/GigWriteFields' }]
      required: [title, description, category]
    GigWritePartial:
      allOf: [{ $ref: '#/components/schemas/GigWriteFields' }]
      minProperties: 1
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, const: alive }
        meta:
          type: object
          required: [requestId]
          properties:
            requestId: { type: string }
